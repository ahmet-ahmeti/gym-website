<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    <title>GYM</title>
</head>
<body>
    <header id="header">
        <div>
            <a href="#section1" id="logo-button">
                IRON <span style="color: rgb(210, 0, 0);">FORGE</span>
            </a>
        </div>
        <div>
            <button id="shopping-cart-button"></button>
        </div>
        <div id="toggle-button">
            <button id="hamburger-button">
                <svg width="35" height="35" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="11" rx="4" fill="#ffffff"/>
                    <rect y="30" width="100" height="11" rx="4" fill="#ffffff"/>
                    <rect y="60" width="100" height="11" rx="4" fill="#ffffff"/>
                </svg>
            </button>
        </div>
    </header>

    <nav id="sidebar">
        <div>
            1
        </div>
        <div>
            2
        </div>
        <div>
            3
        </div>
    </nav>

    <div id="overlay">

    </div>

    <section id="section1">
        <div id="main-page"> 
            <div id="main-page-left">
                <h1>FORGE <span style="color: rgb(210, 0, 0);">YOUR</span> LEGACY</h1>
                <h2>
                  Bëj hapin e parë sot!
                </h2>
            </div>
            <div id="main-page-right">
                <button id="view-progress-button">
                    View Programs
                </button>
                <button id="start-training-button">
                    Start training &#8594;
                </button>
            </div>
        </div>
        <img src="/images/background.png" alt="" id="bg-image">
        <div class="carousel">
            <div class="track" id="track">
                <img src="images/Hammer_strength.webp" alt="" class="slide">
                <img src="images/Pull_ups.webp" alt="" class="slide">
                <img src="images/Tricep_pushdown.webp" alt="" class="slide">
                <img src="images/Woman_curling.jpg" alt="" class="slide">
                <img src="images/Sports_commercial.avif" alt="" class="slide">
                <img src="images/Hammer_strength.webp" alt="" class="slide">
                <img src="images/Pull_ups.webp" alt="" class="slide">
                <img src="images/Tricep_pushdown.webp" alt="" class="slide">
                <img src="images/Woman_curling.jpg" alt="" class="slide">
                <img src="images/Sports_commercial.avif" alt="" class="slide">
            </div>
        </div>
    </section>
    <section id="section2">

    </section>
    <section id="section3">

    </section>

    <script src="script.js"></script>
</body>
</html>
